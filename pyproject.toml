[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "az-agent"
version = "0.1.0"
description = "Multi-provider agentic AI starter for Azure AI Foundry, Amazon Bedrock, and Vertex AI"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
